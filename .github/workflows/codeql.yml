name: "CodeQL Deep-Level Analysis"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "**.txt"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  schedule:
    - cron: "34 22 * * 2"
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Enable CodeQL diagnostic debug artifacts"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CODEQL_RAM: 6144
  CODEQL_THREADS: 0

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js Runtime
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Python Runtime
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml
          ram: ${{ env.CODEQL_RAM }}
          threads: ${{ env.CODEQL_THREADS }}
          debug: ${{ inputs.debug_mode || false }}
          dependency-caching: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          ram: ${{ env.CODEQL_RAM }}
          threads: ${{ env.CODEQL_THREADS }}
          output: ../results
          upload: true
          wait-for-processing: true

      - name: Generate SARIF summary
        if: always()
        shell: bash
        env:
          LANGUAGE: ${{ matrix.language }}
          BUILD_MODE: ${{ matrix.build-mode }}
        run: |
          set -euo pipefail
          sarif_file="../results/${LANGUAGE}.sarif"

          {
            echo "### CodeQL analysis report (${LANGUAGE})"
            echo "- **Query suites:** security-extended + security-and-quality"
            echo "- **Build mode:** ${BUILD_MODE}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$sarif_file" ]]; then
            echo "SARIF output was not produced at \`${sarif_file}\`." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          total_results=$(jq '[.runs[]?.results[]?] | length' "$sarif_file")
          error_count=$(jq '[.runs[]?.results[]? | select(.level == "error")] | length' "$sarif_file")
          warning_count=$(jq '[.runs[]?.results[]? | select(.level == "warning")] | length' "$sarif_file")
          note_count=$(jq '[.runs[]?.results[]? | select(.level == "note")] | length' "$sarif_file")

          {
            echo
            echo "| Severity | Findings |"
            echo "| :--- | ---: |"
            echo "| Error | ${error_count} |"
            echo "| Warning | ${warning_count} |"
            echo "| Note | ${note_count} |"
            echo "| **Total** | **${total_results}** |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if (( total_results > 0 )); then
            echo "Details: GitHub Security > Code scanning alerts. The complete SARIF results were already uploaded by CodeQL." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No findings detected." >> "$GITHUB_STEP_SUMMARY"
          fi
