name: Retired CodeQL config placeholder

# GitHub treats every YAML file in .github/workflows as a workflow. The former
# codeql-config.yml was configuration, not a workflow, and caused a failing run.
# The actual CodeQL config now lives at .github/codeql/codeql-config.yml.
on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired path
        run: echo "This legacy path is intentionally inert; CodeQL config is in .github/codeql/codeql-config.yml."
